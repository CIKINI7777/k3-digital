<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABSENSI K3 DIGITAL</title>
    <link rel="stylesheet" href="style-absen.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ ABSENSI K3</h1>
            <p>Plant 1 - Shift Pagi</p>
        </div>

        <div class="form-group">
            <label>Nama Lengkap:</label>
            <input type="text" id="nama" placeholder="Masukkan nama Anda" required>
        </div>

        <div class="form-group">
            <label>Departemen:</label>
            <select id="departemen" required>
                <option value="">Pilih Departemen</option>
                <option value="Produksi">Produksi</option>
                <option value="Logistik">Logistik</option>
                <option value="Maintenance">Maintenance</option>
                <option value="HRD">HRD</option>
                <option value="IT">IT</option>
                <option value="K3">K3/Safety</option>
                <option value="QC">QC</option>
            </select>
        </div>

        <div class="form-group">
            <label>Status:</label>
            <div class="radio-group">
                <label class="radio-btn">
                    <input type="radio" name="status" value="Masuk" checked>
                    <span>🟢 Masuk</span>
                </label>
                <label class="radio-btn">
                    <input type="radio" name="status" value="Pulang">
                    <span>🔴 Pulang</span>
                </label>
            </div>
        </div>

        <div class="gps-status" id="gps-status">
            📡 Mencari GPS...
        </div>

        <button class="btn-absen" id="btn-absen" onclick="submitAbsen('Masuk')">
            ✅ ABSEN MASUK
        </button>

        <button class="btn-absen btn-pulang" id="btn-pulang" onclick="submitAbsen('Pulang')">
            🏠 ABSEN PULANG
        </button>

        <div id="loading" class="loading" style="display:none;">
            <div class="spinner"></div>
            <p>Mengirim data...</p>
        </div>

        <div class="footer">
            <p>📍 Lokasi GPS akan diambil otomatis</p>
            <p><a href="index.html">← Kembali ke Dashboard</a></p>
        </div>
    </div>

    <script src="script-absen.js"></script>
</body>
</html>
